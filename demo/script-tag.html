<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A site with the widget: the script-tag build</title>
  <link rel="stylesheet" href="hostile.css" id="hostile">
  <script>
    // ?hostile=0 drops the aggressive stylesheet; the content comes from the "CDN" on the next port (demo/serve.mjs).
    if (new URLSearchParams(location.search).get("hostile") === "0") document.getElementById("hostile").remove();
    window.CONTENT = `${location.protocol}//${location.hostname}:${Number(location.port) + 1}/`;
  </script>
</head>
<body>
  <h1>Acme Widgets</h1>
  <p>A host page with its own (aggressive) styles. The talking head sits in the bottom-right corner.</p>
  <!-- One <script> tag: three.js and the widget in one file. -->
  <script src="/dist/talking-head-widget.iife.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    window.widget = TalkingHeadWidget.mount({
      head: CONTENT + "head.glb",
      clips: { welcome: CONTENT + "clips/" + (params.get("clip") || "segment-04") + ".clip.json" },
      autoplay: params.get("autoplay") === "muted" ? "muted" : "on-click",
      load: params.get("load") || "on-visible",
    });
  </script>
</body>
</html>
